name: Curio Explainer Weekly (Monday long video + chapter reels)

on:
  schedule:
    - cron: "15 3 * * 1"   # pondelok 03:15 UTC (~05:15 Bratislava): render trva ~40-60 min, YT publikuje o 17:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Len vygenerovat + vyrenderovat, NEPUBLIKOVAT (artefakty na stiahnutie)"
        type: boolean
        default: false
      topic:
        description: "Konkretna seria (napr. 'Every USB Port Color Explained'); prazdne = dalsia z banky"
        type: string
        default: ""
      no_images:
        description: "Len dlhe video, bez reels (rychlejsi test)"
        type: boolean
        default: false
      spec:
        description: "Hotovy spec JSON (napr. explainer/v2/specs/usb_demo.json) - preskoci Groq generovanie"
        type: string
        default: ""
      publish_run_id:
        description: "LEN PUBLIKOVAT hotovy vystup z ineho behu (run id s artefaktom explainer-output) - preskoci generovanie aj render"
        type: string
        default: ""

permissions:
  contents: write          # stav (explainer_used.json, explainer/scripts/) + GitHub Release hosting reels

concurrency:
  group: explainer-weekly
  cancel-in-progress: false

jobs:
  explainer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests cloudinary kokoro-onnx soundfile Pillow numpy faster-whisper

      - name: Cache HyperFrames Chromium + OpenMoji
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            temp/openmoji
          key: hf-chromium-openmoji-v1

      - name: Cache Kokoro model (~340 MB)
        uses: actions/cache@v4
        with:
          path: kokoro
          key: pro-models-v1

      - name: Cache AI image cache (setri Pollinations pri opakovanom behu)
        uses: actions/cache@v4
        with:
          path: temp/explainer_cache
          key: explainer-images-${{ github.run_id }}
          restore-keys: explainer-images-

      - name: Prepare config
        run: cp config.example.json config.json

      - name: Publish-only - stiahni hotovy vystup z ineho behu
        if: github.event.inputs.publish_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output/explainer
          gh run download "${{ github.event.inputs.publish_run_id }}" -n explainer-output -D output/explainer
          ls -la output/explainer/*/

      - name: Run weekly explainer
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
          MODELS_BASE_URL: https://api.groq.com/openai/v1
          MODELS_MODEL: openai/gpt-oss-120b
          MODELS_FALLBACK: openai/gpt-oss-20b
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          HF_WORKERS: "2"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ "${{ github.event.inputs.no_images }}" = "true" ]; then ARGS="$ARGS --long-only"; fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""; fi
          if [ -n "${{ github.event.inputs.spec }}" ]; then ARGS="$ARGS --spec ${{ github.event.inputs.spec }}"; fi
          if [ -n "${{ github.event.inputs.publish_run_id }}" ]; then
            META=$(ls output/explainer/*/meta.json | head -1)
            echo "Publish-only: $META"
            python explainer/publish.py "$META"
          else
            eval python explainer/v2/run_v2.py $ARGS
          fi

      - name: Upload outputs as artifact (dry-run alebo kontrola)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explainer-output
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/explainer/**/long.mp4
            output/explainer/**/reel_*.mp4
            output/explainer/**/thumb.jpg
            output/explainer/**/sheet.jpg
            output/explainer/**/meta.json

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f config.json
          git add explainer/explainer_used.json explainer/explainer_bank.json explainer/explainer_state.json explainer/scripts/ explainer/v2/specs/ 2>/dev/null || true
          git commit -m "explainer: weekly run $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || echo "nothing to push"
